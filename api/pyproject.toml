[project]
name = "padrom-sanctions-api"
version = "0.1.0"
description = "PADROM Sanctions Screening microservice — PoC"
requires-python = ">=3.12"
dependencies = [
    # Web framework — [standard] pulls in uvicorn + python-multipart
    "fastapi[standard]>=0.115",
    # Async ORM + asyncpg driver (no sync fallback needed in this project)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Schema migrations — async template used in alembic/env.py
    "alembic>=1.13",
    # Validation and settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Fuzzy name matching for sanctions screening
    "rapidfuzz>=3.9",
    # Async HTTP client — used for downloading EU/UN sanctions XML feeds
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # testcontainers spins up a real Postgres per test session
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    # Pydantic mypy plugin for strict type checking of models
    "pydantic[mypy]>=2.7",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# Mypy — strict mode; pydantic plugin validates model field types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest — auto asyncio mode means no @pytest.mark.asyncio needed on tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
