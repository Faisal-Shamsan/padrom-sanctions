name: API CI

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  lint-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies (including dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies (including dev)
        run: uv sync --frozen

      - name: Run tests
        # testcontainers starts its own Postgres via Docker — no service container needed.
        # Docker is available on ubuntu-latest GitHub Actions runners.
        run: uv run pytest tests -v
